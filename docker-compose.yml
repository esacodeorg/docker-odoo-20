# version: "24.0.9"

services:
  web:
    build:
      context: ./odoo/
    container_name: odoo_20_server
    command: -- --dev=reload
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072" # long polling, utile seulement si workers > 0
    volumes:
      - ./odoo/config:/etc/odoo:rw
      - ./odoo/config/odoo.conf:/etc/odoo/odoo.conf
      - ./odoo/addons:/mnt/extra-addons:rw # vos modules
      - web_data:/var/lib/odoo # filestore + sessions
    # logging:
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
  db:
    image: postgres:17
    container_name: postgres_17_server
    volumes:
      - ./odoo/config:/etc/odoo/db
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    # logging:
    #   options:
    #     max-size: "10m"
    #     max-file: "3"

# Volumes nommes : sans eux, Docker en cree des anonymes a chaque
# recreation de conteneur, et la base d'hier devient introuvable.
volumes:
  db_data:
  web_data:
